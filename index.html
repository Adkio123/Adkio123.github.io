<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>签到系统-邮箱验证</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body{background:#1f2937;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;padding:20px}
        .box{width:100%;max-width:360px;padding:30px;background:#111827;border-radius:12px;box-shadow:0 0 20px #00000040}
        h2{text-align:center;margin-bottom:24px;color:#e5e7eb}
        .item{margin-bottom:16px}
        label{display:block;margin-bottom:6px;font-size:14px;color:#d1d5db}
        input{width:100%;padding:12px;border-radius:8px;border:1px solid #374151;background:#1f2937;color:#fff;outline:none;font-size:16px}
        .row{display:flex;gap:10px}
        #email{flex:1}
        #getCode{width:120px;background:#2563eb;border:none;color:#fff;border-radius:8px;cursor:pointer;padding:12px;font-size:14px}
        #getCode:disabled{background:#475569;cursor:not-allowed}
        #submit{width:100%;padding:12px;background:#10b981;border:none;color:#fff;border-radius:8px;font-size:16px;cursor:pointer;margin-top:8px}
        #submit:disabled{background:#065f46;cursor:not-allowed}
        #msg{margin-top:14px;text-align:center;font-size:14px}
    </style>
</head>
<body>
    <div class="box">
        <h2>注册验证</h2>
        <div class="item">
            <label>邮箱</label>
            <div class="row">
                <input id="email" type="email" placeholder="请输入QQ邮箱">
                <button id="getCode">获取验证码</button>
            </div>
        </div>
        <div class="item">
            <label>验证码</label>
            <input id="code" type="text" placeholder="输入6位验证码">
        </div>
        <button id="submit">提交验证</button>
        <div id="msg"></div>
    </div>

<script>
const API_BASE = "https://替换成你的render地址";

const getBtn = document.getElementById('getCode');
const submitBtn = document.getElementById('submit');
const emailInput = document.getElementById('email');
const codeInput = document.getElementById('code');
const msgBox = document.getElementById('msg');

getBtn.onclick = async ()=>{
    const email = emailInput.value.trim();
    if(!email){msgBox.innerText="请输入邮箱";msgBox.style.color="#f87171";return;}
    getBtn.disabled = true;
    msgBox.innerText="请求中...";
    msgBox.style.color="#93c5fd";
    try{
        const res = await fetch(`${API_BASE}/api/send-code`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({email})
        })
        const data = await res.json();
        msgBox.innerText = data.msg;
        msgBox.style.color = data.ok ? "#34d399" : "#f87171";
    }catch(err){
        msgBox.innerText="连接后端失败，请稍后重试";
        msgBox.style.color="#f87171";
    }
    let count = 60;
    const timer = setInterval(()=>{
        count--;
        getBtn.innerText = `${count}s`;
        if(count <=0){
            clearInterval(timer);
            getBtn.innerText = "获取验证码";
            getBtn.disabled = false;
        }
    },1000)
}

submitBtn.onclick = async ()=>{
    const email = emailInput.value.trim();
    const code = codeInput.value.trim();
    if(!email||!code){msgBox.innerText="邮箱和验证码不能为空";msgBox.style.color="#f87171";return;}
    try{
        const res = await fetch(`${API_BASE}/api/verify-code`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({email,code})
        })
        const data = await res.json();
        msgBox.innerText = data.msg;
        msgBox.style.color = data.ok ? "#34d399" : "#f87171";
    }catch(err){
        msgBox.innerText="验证请求失败";
        msgBox.style.color="#f87171";
    }
}
</script>
</body>
</html>
