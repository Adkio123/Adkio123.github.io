<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KamiSM卡密激活</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body{
            background:radial-gradient(circle at top,#252233,#0f0f16);
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:16px;
            color:#fff;
        }
        .box{
            width:440px;
            background:#1b1b27;
            border:1px solid #35354a;
            border-radius:20px;
            padding:32px;
            box-shadow:0 10px 35px rgba(0,0,0,0.35);
        }
        h1{
            text-align:center;
            font-size:23px;
            color:#c7b7ff;
            margin-bottom:24px;
        }
        input{
            width:100%;
            padding:14px 16px;
            background:#272738;
            border:1px solid #44445c;
            border-radius:10px;
            color:#fff;
            font-size:15px;
            outline:none;
            margin-bottom:16px;
        }
        input:focus{border-color:#8b6dff}
        .btns{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:10px;
            margin-bottom:18px;
        }
        button{
            padding:13px;
            border:none;
            border-radius:10px;
            font-size:15px;
            cursor:pointer;
        }
        .btn1{background:#7c5cff;color:#fff}
        .btn1:hover{background:#6645e2}
        .btn2{background:#2f2f42;color:#e2e2f0}
        .btn2:hover{background:#3c3c52}
        .devinfo{
            background:#222231;
            padding:14px;
            border-radius:12px;
            font-size:14px;
            margin-bottom:16px;
        }
        #msg{
            text-align:center;
            min-height:65px;
            line-height:1.8;
            font-size:14.5px;
        }
        .success{color:#76f09c}
        .error{color:#ff7b7b}
        .warn{color:#ffcf66}
        #debug{
            margin-top:10px;
            font-size:12px;
            color:#888899;
            word-break:break-all;
        }
    </style>
</head>
<body>
<div class="box">
    <h1>卡密激活验证</h1>
    <input id="cardInput" placeholder="输入卡密">
    <div class="btns">
        <button class="btn1" onclick="activateCard()">激活卡密</button>
        <button class="btn2" onclick="queryCard()">查询卡密</button>
    </div>
    <div class="devinfo">本机设备ID：<span id="devIdText"></span></div>
    <div id="msg"></div>
    <div id="debug"></div>
</div>

<script>
const API_ACTIVATE = "https://km.fly-fly.fun/api/v1/activate";
const API_QUERY = "https://km.fly-fly.fun/api/v1/verify";
const API_KEY = "km_lix7dutpdksvo5995r9i36nloc7vp2wn";
const APP_ID = "fa3a17c1-02e3-4c9c-8042-73f05a89f7fe";

function getDeviceId(){
    let id = localStorage.getItem("kamism_device_id");
    if(!id){
        id = "dev_" + Math.random().toString(36).slice(2,14);
        localStorage.setItem("kamism_device_id",id);
    }
    return id;
}

window.onload = ()=>{
    document.getElementById("devIdText").innerText = getDeviceId();
}

function setMsg(text,type){
    const m = document.getElementById("msg");
    m.innerText = text;
    m.className = type||"";
}
function setDebug(t){
    document.getElementById("debug").innerText = t;
}

async function activateCard(){
    const card = document.getElementById("cardInput").value.trim();
    const dev = getDeviceId();
    setDebug("");
    if(!card) return setMsg("请输入卡密","error");
    setMsg("正在激活…","warn");
    try{
        const res = await fetch(API_ACTIVATE,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                api_key:API_KEY,
                app_id:APP_ID,
                card_code:card,
                device_id:dev,
                device_name:"网页浏览器客户端"
            })
        })
        const raw = await res.text();
        setDebug("原始返回："+raw);
        const data = JSON.parse(raw);
        if(data.code===200){
            setMsg(`✅激活成功\n剩余天数：${data.data.days}天`,"success");
        }else{
            setMsg(`❌失败：${data.msg}`,"error");
        }
    }catch(e){
        setMsg("❌跨域错误！本地打开不可用，必须部署到网页托管平台","error");
        setDebug("错误："+e.toString());
    }
}

async function queryCard(){
    const card = document.getElementById("cardInput").value.trim();
    setDebug("");
    if(!card) return setMsg("请输入卡密","error");
    setMsg("正在查询…","warn");
    try{
        const res = await fetch(API_QUERY,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                api_key:API_KEY,
                app_id:APP_ID,
                card_code:card,
                device_id:getDeviceId()
            })
        })
        const raw = await res.text();
        setDebug("原始返回："+raw);
        const data = JSON.parse(raw);
        if(data.code===200){
            setMsg(`✅查询成功\n剩余天数：${data.data.days}天`,"success");
        }else{
            setMsg(`❌失败：${data.msg}`,"error");
        }
    }catch(e){
        setMsg("❌跨域错误！本地打开不可用，必须部署网页托管平台","error");
        setDebug("错误："+e.toString());
    }
}
</script>
</body>
</html>
