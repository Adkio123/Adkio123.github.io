<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡密激活 - 高阶五子棋</title>
<style>
* {
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.35), transparent 40%),
    radial-gradient(circle at 80% 30%, rgba(236, 72, 153, 0.25), transparent 45%),
    radial-gradient(circle at 50% 80%, rgba(14, 165, 233, 0.35), transparent 40%),
    linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
  color: #fff;
  padding: 20px;
  position: relative;
  overflow-x: hidden;
}

.glass-panel {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 24px;
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  box-shadow:
    0 10px 40px rgba(0, 0, 0, 0.35),
    inset 0 1px 0 rgba(255, 255, 255, 0.12);
  padding: 24px;
  max-width: 440px;
  margin: 0 auto 16px;
}

h2 {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 18px;
  background: linear-gradient(90deg, #60a5fa, #a78bfa);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

h3 {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 14px;
  color: #e2e8f0;
}

input {
  width: 100%;
  padding: 14px 16px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
  font-size: 16px;
  outline: none;
  transition: 0.25s;
}

input:focus {
  border-color: rgba(96, 165, 250, 0.6);
  background: rgba(255, 255, 255, 0.14);
  box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15);
}

button {
  border: none;
  border-radius: 14px;
  padding: 13px 18px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.25s;
  color: #fff;
}

.btn-primary {
  width: 100%;
  background: linear-gradient(135deg, #3b82f6, #6366f1);
  box-shadow: 0 8px 24px rgba(59, 130, 246, 0.45);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 30px rgba(59, 130, 246, 0.55);
}

.btn-ghost {
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(12px);
}

.btn-ghost:hover {
  background: rgba(255, 255, 255, 0.2);
}

#msg {
  margin-top: 14px;
  font-size: 14px;
  line-height: 1.7;
  white-space: pre-line;
  color: #cbd5e1;
}

#gameWrap {
  display: none;
}

canvas {
  width: 100%;
  height: auto;
  background: rgba(222, 184, 135, 0.85);
  border-radius: 18px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
}

.game-buttons {
  display: flex;
  gap: 10px;
  margin-top: 14px;
  justify-content: center;
}

.consult-btn {
  position: fixed;
  right: 20px;
  bottom: 24px;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: linear-gradient(135deg, #ec4899, #f43f5e);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  box-shadow: 0 10px 30px rgba(236, 72, 153, 0.55);
  border: 2px solid rgba(255, 255, 255, 0.3);
  z-index: 999;
  animation: pulse-glow 2s infinite;
}

.consult-btn:hover {
  transform: scale(1.08);
}

@keyframes pulse-glow {
  0%, 100% {
    box-shadow: 0 10px 30px rgba(236, 72, 153, 0.55);
  }
  50% {
    box-shadow: 0 10px 40px rgba(236, 72, 153, 0.85);
  }
}
</style>
</head>
<body>

<div class="glass-panel">
  <h2>卡密激活</h2>
  <input id="keyInput" placeholder="请输入卡密">
  <button class="btn-primary" onclick="activate()">激活</button>
  <div id="msg"></div>

  <div id="gameWrap">
    <h3>高阶五子棋</h3>
    <canvas id="board" width="450" height="450"></canvas>
    <div class="game-buttons">
      <button class="btn-ghost" onclick="restartGame()">重新开局</button>
    </div>
  </div>
</div>

<button class="consult-btn" id="consultBtn" onclick="consult()">咨询</button>

<script>
const APP_ID = "fa3a17c1-02e3-4c9c-8042-73f05a89f7fe";
const API_URL = "https://api.kamism.com/v1/activate";

let canvas, ctx;
let size = 15;
let cell = 30;
let board = [];
let human = 1;
let ai = 2;

async function activate() {
  const key = document.getElementById("keyInput").value.trim();
  const msgBox = document.getElementById("msg");
  const gameWrap = document.getElementById("gameWrap");
  const consultBtn = document.getElementById("consultBtn");

  if (window.location.protocol === "content:" || window.location.protocol === "file:") {
    msgBox.textContent = "⚠️禁止本地打开！请使用GitHub Pages https链接访问";
    return;
  }

  if (!key) {
    msgBox.textContent = "请输入卡密";
    return;
  }

  msgBox.textContent = "正在激活...";

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      mode: "cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ appid: APP_ID, key: key })
    });

    const data = await res.json();

    if (data.code === 200) {
      const remainDay = data.data.days;
      msgBox.textContent = "激活成功！剩余到期天数：" + remainDay + "天\n已进入高阶五子棋";
      gameWrap.style.display = "block";
      consultBtn.style.display = "none";
      initGame();
    } else {
      msgBox.textContent = "激活失败：" + data.msg;
    }
  } catch (err) {
    console.log(err);
    msgBox.textContent = "请求异常：" + err.message;
  }
}

function consult() {
  alert("咨询功能：请联系客服获取帮助。");
}

function initGame() {
  canvas = document.getElementById("board");
  ctx = canvas.getContext("2d");
  board = Array(size).fill().map(() => Array(size).fill(0));
  drawBoard();
  aiFirstMove();
  canvas.onclick = clickBoard;
}

function aiFirstMove() {
  let cx = Math.floor(size / 2);
  let rx = cx + Math.floor(Math.random() * 5) - 2;
  let ry = cx + Math.floor(Math.random() * 5) - 2;
  rx = Math.max(2, Math.min(size - 3, rx));
  ry = Math.max(2, Math.min(size - 3, ry));
  board[ry][rx] = ai;
  drawBoard();
}

function drawBoard() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = "rgba(0, 0, 0, 0.75)";
  for (let i = 0; i < size; i++) {
    ctx.beginPath();
    ctx.moveTo(cell / 2 + i * cell, cell / 2);
    ctx.lineTo(cell / 2 + i * cell, cell * size - cell / 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cell / 2, cell / 2 + i * cell);
    ctx.lineTo(cell * size - cell / 2, cell / 2 + i * cell);
    ctx.stroke();
  }

  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      let p = board[y][x];
      if (!p) continue;
      ctx.beginPath();
      ctx.arc(cell / 2 + x * cell, cell / 2 + y * cell, 12, 0, Math.PI * 2);
      ctx.fillStyle = p === 1 ? "#0b1220" : "#f8fafc";
      ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,0.35)";
      ctx.stroke();
    }
  }
}

function clickBoard(e) {
  let rect = canvas.getBoundingClientRect();
  let scaleX = canvas.width / rect.width;
  let scaleY = canvas.height / rect.height;
  let x = Math.round((e.clientX - rect.left - cell / 2) * scaleX / cell);
  let y = Math.round((e.clientY - rect.top - cell / 2) * scaleY / cell);
  if (x < 0 || x >= size || y < 0 || y >= size || board[y][x]) return;
  board[y][x] = human;
  drawBoard();
  if (checkWin(human)) {
    alert("你赢了！");
    return;
  }
  aiTurn();
}

function aiTurn() {
  let best = null;
  let maxScore = -99999;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      if (board[y][x]) continue;
      let s = evalPoint(x, y);
      if (s > maxScore) {
        maxScore = s;
        best = { x, y };
      }
    }
  }
  if (best) {
    board[best.y][best.x] = ai;
    drawBoard();
    if (checkWin(ai)) alert("AI获胜！");
  }
}

function evalPoint(x, y) {
  board[y][x] = ai;
  let aiSc = calcAll(x, y, ai);
  board[y][x] = human;
  let huSc = calcAll(x, y, human);
  board[y][x] = 0;
  return aiSc * 1.4 + huSc;
}

function calcAll(px, py, player) {
  let dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
  let total = 0;
  for (let [dx, dy] of dirs) total += countLine(px, py, dx, dy, player);
  return total;
}

function countLine(px, py, dx, dy, pl) {
  let cnt = 1;
  let r = 0;
  let x = px + dx, y = py + dy;
  while (x >= 0 && x < size && y >= 0 && y < size && board[y][x] === pl) {
    cnt++; r++; x += dx; y += dy;
  }
  let l = 0;
  x = px - dx; y = py - dy;
  while (x >= 0 && x < size && y >= 0 && y < size && board[y][x] === pl) {
    cnt++; l++; x -= dx; y -= dy;
  }
  let leftOpen = (px - dx * l >= 0 && py - dy * l >= 0 && px - dx * l < size && py - dy * l < size) ? board[py - dy * l][px - dx * l] === 0 : false;
  let rightOpen = (px + dx * r >= 0 && py + dy * r >= 0 && px + dx * r < size && py + dy * r < size) ? board[py + dy * r][px + dx * r] === 0 : false;
  let open = 0;
  if (leftOpen) open++;
  if (rightOpen) open++;
  if (cnt >= 5) return 100000;
  if (cnt === 4 && open >= 1) return 12000;
  if (cnt === 3 && open >= 2) return 2200;
  if (cnt === 3 && open === 1) return 750;
  if (cnt === 2 && open >= 2) return 260;
  if (cnt === 2 && open === 1) return 70;
  return 8;
}

function checkWin(p) {
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      if (board[y][x] !== p) continue;
      let d = [[1, 0], [0, 1], [1, 1], [1, -1]];
      for (let [dx, dy] of d) {
        let c = 1;
        let nx = x + dx, ny = y + dy;
        while (nx >= 0 && nx < size && ny >= 0 && ny < size && board[ny][nx] === p) {
          c++; nx += dx; ny += dy;
        }
        if (c >= 5) return true;
      }
    }
  }
  return false;
}

function restartGame() {
  initGame();
}
</script>
</body>
</html>
