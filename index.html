<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测试版 AI 1.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    background:#05050a;
    color:#f0f4ff;
    padding:12px;
    font-family:"Segoe UI",Roboto,system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    overflow-x:hidden;
    min-height:100vh;
}
/* 星星置顶，允许点击穿透 */
#stars{
    position:fixed;
    top:0;left:0;
    width:100vw;height:100vh;
    z-index:9998;
    pointer-events:none;
}
/* 雪花置顶最高层级，不会拦截鼠标点击 */
#snow{
    position:fixed;
    top:0;left:0;
    width:100vw;height:100vh;
    z-index:9999;
    pointer-events:none;
}
#chatBox{
    position:relative;
    z-index:1;
    height:65vh;
    overflow-y:auto;
    border:1px solid #2a2a44;
    border-radius:12px;
    padding:12px;
    margin-bottom:12px;
    background:rgba(12,12,24,0.65);
    backdrop-filter:blur(4px);
}
.user{
    background:#244088;
    padding:10px 14px;
    border-radius:12px;
    margin:8px 0;
    text-align:right;
    max-width:82%;
    margin-left:auto;
    font-size:15px;
    line-height:1.5;
}
.ai{
    background:#1f2238;
    padding:10px 14px;
    border-radius:12px;
    margin:8px 0;
    text-align:left;
    max-width:82%;
    margin-right:auto;
    font-size:15px;
    line-height:1.5;
}
#bar{
    position:relative;
    z-index:1;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}
#inp{
    flex:1;
    background:rgba(22,24,42,0.75);
    border:1px solid #333858;
    color:#f0f4ff;
    border-radius:10px;
    padding:11px 14px;
    font-size:15px;
    min-width:140px;
    outline:none;
}
#inp:focus{
    border-color:#5078dd;
}
button{
    background:#3869dd;
    color:#fff;
    border:none;
    border-radius:10px;
    padding:9px 16px;
    font-size:15px;
    white-space:nowrap;
    cursor:pointer;
}
#chatBox::-webkit-scrollbar{width:6px;}
#chatBox::-webkit-scrollbar-thumb{background:#384066;border-radius:3px;}

@keyframes twinkle{
    0%{opacity:0.2;}
    100%{opacity:0.8;}
}
@keyframes snowfall{
    0%{transform:translateY(-10px);opacity:0;}
    10%{opacity:1;}
    100%{transform:translateY(100vh);opacity:0;}
}
</style>
</head>
<body>
<div id="stars"></div>
<div id="snow"></div>

<div id="chatBox"></div>
<div id="bar">
    <input id="inp" placeholder="输入消息...">
    <button onclick="send()">发送</button>
</div>

<script>
const API_URL = "https://speed.toter.me/v1/chat/completions";
const MODEL = "claude-sonnet-4-5";
const SYSTEM_PROMPT = "你是我的专属AI，回答简洁友好，只处理文本对话。";

// 创建星星
const starsDom = document.getElementById("stars");
for(let i=0;i<120;i++){
    const s = document.createElement("div");
    const size = Math.random()*2+1;
    s.style.position = "absolute";
    s.style.background = "#fff";
    s.style.borderRadius = "50%";
    s.style.width = size+"px";
    s.style.height = size+"px";
    s.style.left = Math.random()*100+"%";
    s.style.top = Math.random()*100+"%";
    s.style.opacity = Math.random()*0.7+0.2;
    s.style.animation = `twinkle ${Math.random()*3+2}s infinite ease-in-out alternate`;
    starsDom.appendChild(s);
}

// 创建雪花
const snowDom = document.getElementById("snow");
function createSnow(){
    const flake = document.createElement("div");
    const size = Math.random()*4+2;
    flake.style.position = "absolute";
    flake.style.background = "#ffffff";
    flake.style.borderRadius = "50%";
    flake.style.width = size+"px";
    flake.style.height = size+"px";
    flake.style.left = Math.random()*100+"%";
    flake.style.animation = `snowfall ${Math.random()*8+6}s linear infinite`;
    snowDom.appendChild(flake);
    setTimeout(()=>flake.remove(),14000);
}
setInterval(createSnow,120);

async function send(){
    const text = inp.value.trim();
    if(!text) return;
    chatBox.innerHTML += `<div class="user">${text}</div>`;
    inp.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;

    const messages = [
        {role:"system", content:SYSTEM_PROMPT},
        {role:"user", content:text}
    ];

    try{
        const res = await fetch(API_URL,{
            method:"POST",
            headers:{
                "Authorization":"Bearer sk-WvYQUPHX2qbDNBMi7ZlzUQ4pmbnkqinDarSrjmtl31JJTB17",
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                model:MODEL,
                messages:messages,
                temperature:0.7
            })
        });
        const data = await res.json();
        const ans = data.choices[0].message.content;
        chatBox.innerHTML += `<div class="ai">${ans}</div>`;
    }catch(err){
        chatBox.innerHTML += `<div class="ai">❌请求失败：${err.message}</div>`;
    }
    chatBox.scrollTop = chatBox.scrollHeight;
}

inp.addEventListener("keydown",e=>{if(e.key==="Enter") send()})
</script>
</body>
</html>
